name: Project Test Suite

on: [push, pull_request]

jobs:
  project-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,research]"
      - name: Verify project memory
        run: python -m pytest tests/test_project_memory.py -q
      - name: Run full project suite
        run: python -m pytest -q
